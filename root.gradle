import java.util.Locale

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.10' apply false
    id 'org.polyfrost.multi-version.root'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

preprocess {
    createNode('1.8.9-forge', 10809, 'srg')
}

// 26.2 Fabric uses its own Gradle 9 wrapper under versions/26.2-fabric (see settings.gradle comment).
// versions/26.1-fabric is archived (like 1.21.11-fabric) and is not hooked into the root build.
tasks.register('build26_2Fabric', Exec) {
    group = 'build'
    description = 'Runs versions/26.2-fabric/gradlew build (Gradle 9 + no-remap Loom).'
    workingDir = file('versions/26.2-fabric')
    def win = System.getProperty('os.name').toLowerCase(Locale.US).contains('windows')
    if (win) {
        commandLine 'cmd', '/c', 'gradlew.bat', 'build', '--no-daemon'
    } else {
        commandLine './gradlew', 'build', '--no-daemon'
    }
}

// `gradlew build` runs subproject `:build` tasks; this root project has no `:build`, so hook those instead.
gradle.projectsEvaluated {
    if (rootProject.findProperty('skip262Fabric') == 'true') {
        return
    }
    def fabric262 = rootProject.tasks.named('build26_2Fabric')
    rootProject.subprojects.each { sp ->
        sp.tasks.matching { it.name == 'build' }.configureEach { t ->
            t.dependsOn(fabric262)
        }
    }
    def rootBuild = rootProject.tasks.findByName('build')
    if (rootBuild != null) {
        rootBuild.dependsOn(fabric262)
    }
}

tasks.whenTaskAdded { t ->
    if (t.project == rootProject && t.name == 'build' && findProperty('skip262Fabric') != 'true') {
        t.dependsOn(tasks.named('build26_2Fabric'))
    }
}
